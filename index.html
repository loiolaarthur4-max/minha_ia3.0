<!DOCTYPE html>
<html>
<head>
    <title>Minha IA Inventor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .box { padding: 10px; margin: 10px 0; border-radius: 10px; max-width: 80%; }
        .user { background: #007bff; align-self: flex-end; margin-left: auto; }
        .bot { background: #333; }
        #input-area { padding: 20px; display: flex; gap: 10px; background: #1e1e1e; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { background: #00ff88; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="Fale com sua IA...">
        <button onclick="enviar()">Enviar</button>
    </div>
    <script>
        async function enviar() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const texto = input.value;
            if(!texto) return;
            chat.innerHTML += `<div class="box user">${texto}</div>`;
            input.value = '';
            // A mágica acontece aqui
            const res = await fetch(`/api/chat?pergunta=${encodeURIComponent(texto)}`);
            const data = await res.json();
            chat.innerHTML += `<div class="box bot">${data.resposta}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
